name: Render DSA Remotion Video

on:
  push:
    paths:
      - 'remotion-engine/**'
      - '.github/workflows/render-dsa-remotion.yml'
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition to render
        required: true
        default: DsaExplainer
        type: choice
        options:
          - DsaExplainer

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion-engine/package.json
      - name: Install dependencies
        run: npm install
      - name: Render MP4
        run: npm run render:sample
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: dsa-remotion-video
          path: remotion-engine/out/dsa-explainer.mp4
          if-no-files-found: error
          retention-days: 14
